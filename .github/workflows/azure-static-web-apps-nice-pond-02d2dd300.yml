
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy static website
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Keep the existing Azure-generated secret reference here.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_POND_02D2DD300 }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
